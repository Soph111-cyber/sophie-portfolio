name: Deploy Wonderland to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Snapshot public portfolio and media
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, urllib.parse
          root = pathlib.Path('docs')
          origin = 'https://ddpctbzxgiilncumkyje.supabase.co'
          endpoint = origin + '/functions/v1/wonderland-admin'
          req = urllib.request.Request(endpoint, data=b'{"action":"getPublished"}', headers={'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              published = json.load(response)
          payload = published.get('payload')
          if not isinstance(payload, dict) or not isinstance(payload.get('sections'), list) or not payload['sections']:
              raise RuntimeError('No valid published portfolio; keep previous deployment')
          media = root / 'snapshot-media'
          media.mkdir(exist_ok=True)
          mapping = {}
          def copy_public(value):
              if isinstance(value, dict):
                  return {k: copy_public(v) for k,v in value.items()}
              if isinstance(value, list):
                  return [copy_public(v) for v in value]
              if not isinstance(value, str) or not value.startswith(origin + '/storage/v1/object/public/'):
                  return value
              if value in mapping:
                  return mapping[value]
              parsed = urllib.parse.urlsplit(value)
              ext = pathlib.PurePosixPath(parsed.path).suffix.lower()
              if ext not in ('.jpg','.jpeg','.png','.webp','.gif','.avif','.svg','.mp4','.webm','.mov','.pdf'):
                  ext = ''
              name = hashlib.sha256(value.encode()).hexdigest() + ext
              dest = media / name
              with urllib.request.urlopen(value, timeout=60) as response:
                  content = response.read(100 * 1024 * 1024 + 1)
              if not content or len(content) > 100 * 1024 * 1024:
                  raise RuntimeError('Invalid or oversized public asset; keep previous deployment')
              dest.write_bytes(content)
              mapping[value] = './snapshot-media/' + name
              return mapping[value]
          snapshot = copy_public(payload)
          (root / 'portfolio-snapshot.json').write_text(json.dumps({'payload':snapshot,'media':mapping},ensure_ascii=False),encoding='utf-8')
          print('Public snapshot validated:', len(payload['sections']), 'rooms;',len(mapping),'local assets')
          js = root / 'perfect.js'
          source = js.read_text(encoding='utf-8')
          previous = "async function loadPublished(){try{const j=await api('getPublished');if(j.payload&&Array.isArray(j.payload.sections))data=migrate(j.payload)}catch(e){console.warn('Cloud load failed',e)}renderAll()}"
          replacement = """async function loadPublished(){
            const snapshotPromise=fetch('./portfolio-snapshot.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Snapshot unavailable');return r.json()}).catch(()=>null);
            const cloudPromise=api('getPublished').catch(()=>null);
            const snapshot=await snapshotPromise;
            if(snapshot?.payload&&Array.isArray(snapshot.payload.sections)){data=migrate(snapshot.payload);renderAll();}
            const live=await Promise.race([cloudPromise,new Promise(resolve=>setTimeout(()=>resolve(null),4000))]);
            if(live?.payload&&Array.isArray(live.payload.sections)){
              const map=snapshot?.media||{};
              const localize=v=>typeof v==='string'?(map[v]||v):Array.isArray(v)?v.map(localize):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,localize(x)])):v;
              if(!adminToken){data=migrate(localize(live.payload));renderAll();}
            }else if(!snapshot){renderAll();}
          }"""
          if source.count(previous)!=1:
              raise RuntimeError('Published loader changed; refusing unsafe deployment')
          js.write_text(source.replace(previous,replacement),encoding='utf-8')
          index=root/'index.html'
          html=index.read_text(encoding='utf-8')
          import re
          html=re.sub(r'perfect\.js\?v=[^"]+', 'perfect.js?v=snapshot-' + hashlib.sha256(js.read_bytes()).hexdigest()[:12],html,count=1)
          index.write_text(html,encoding='utf-8')
          PY
      - name: Upload Wonderland
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
